[project]
name = "feed-clean"
version = "0.1.0"
description = "Dedupe, normalise, validate and report on a dirty product feed CSV."
requires-python = ">=3.12"
# No runtime dependencies, deliberately. Everything this does is csv, re,
# decimal and html from the standard library, so `make run` installs nothing
# and there is no wheel to go stale between now and the next time you need it.
dependencies = []

[project.optional-dependencies]
# The .xlsx half of the output. Optional rather than required, so the paragraph
# above stays literally true: without it you get the three CSVs and a line
# saying the workbook was skipped, which is a complete result and not a failure.
xlsx = [
    "openpyxl==3.1.5",
]
dev = [
    "pytest==8.3.3",
    "openpyxl==3.1.5",
]
# Only needed to regenerate demo/out/. Kept out of the default install so
# `make run` does not pull a browser down for a job that does not need one.
demo = [
    "playwright==1.47.0",
    "openpyxl==3.1.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["feed_clean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
